<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Slate Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Warm Professional Pencil Body Gradient -->
    <linearGradient id="pencilBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Subtle Glow for Grid & Precision Marks -->
    <filter id="gridGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Pencil -->
    <filter id="pencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Enhanced & High-Visibility Dotted Geometric Grid Structure -->
  <g filter="url(#gridGlow)">
    <!-- Outer Dotted Concentric Circle -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,10" stroke-linecap="round" opacity="0.45" />
    
    <!-- Primary Dotted Circle -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,9" stroke-linecap="round" opacity="0.75" />

    <!-- Inner Dotted Protractor Ring -->
    <circle cx="256" cy="256" r="75" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="3,7" stroke-linecap="round" opacity="0.65" />

    <!-- Main Crosshair Axes (Horizontal & Vertical Dotted Lines) -->
    <line x1="56" y1="256" x2="456" y2="256" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,9" stroke-linecap="round" opacity="0.75" />
    <line x1="256" y1="56" x2="256" y2="456" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,9" stroke-linecap="round" opacity="0.75" />

    <!-- Diagonal 45-Degree Ratio Guides -->
    <line x1="110" y1="110" x2="402" y2="402" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,10" stroke-linecap="round" opacity="0.45" />
    <line x1="402" y1="110" x2="110" y2="402" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,10" stroke-linecap="round" opacity="0.45" />

    <!-- Key Ratio Intersection Nodes -->
    <circle cx="256" cy="126" r="4.5" fill="#38BDF8" opacity="0.9" />
    <circle cx="256" cy="386" r="4.5" fill="#38BDF8" opacity="0.9" />
    <circle cx="126" cy="256" r="4.5" fill="#38BDF8" opacity="0.9" />
    <circle cx="386" cy="256" r="4.5" fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- Centered Sketching Pencil (Geometric Center at 256, 256, Angled at 45 Degrees) -->
  <g transform="translate(256, 256) rotate(45)" filter="url(#pencilShadow)">
    
    <!-- Pencil Body (Centered around y = 0) -->
    <rect x="-16" y="-82" width="32" height="132" rx="4" fill="url(#pencilBody)" />
    
    <!-- 3D Light Highlight Stripe -->
    <rect x="-6" y="-78" width="7" height="124" rx="2" fill="#FEF3C7" opacity="0.38" />

    <!-- Metal Ferrule -->
    <rect x="-16" y="-102" width="32" height="20" fill="#CBD5E1" />
    <line x1="-16" y1="-95" x2="16" y2="-95" stroke="#64748B" stroke-width="2" />
    <line x1="-16" y1="-89" x2="16" y2="-89" stroke="#64748B" stroke-width="2" />

    <!-- Pink Eraser -->
    <path d="M -16 -102 L -16 -118 A 16 16 0 0 1 16 -118 L 16 -102 Z" fill="#F43F5E" />
    <path d="M -7 -109 L 7 -109" stroke="#FDA4AF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sharpened Wood Cone -->
    <polygon points="-16,50 16,50 0,88" fill="#FDE68A" />
    <line x1="0" y1="50" x2="0" y2="88" stroke="#F59E0B" stroke-width="1.5" opacity="0.45" />

    <!-- Graphite Tip -->
    <polygon points="-5,76 5,76 0,88" fill="#0F172A" />

  </g>
</svg>